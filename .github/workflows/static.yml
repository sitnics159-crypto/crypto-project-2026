
# Deploy static content to GitHub Pages from main only.
name: Deploy static content to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Stage site files
        run: |
          mkdir -p "${RUNNER_TEMP}/pages-site"
          install -m 644 index.html "${RUNNER_TEMP}/pages-site/index.html"
          install -m 644 token-balances.mjs "${RUNNER_TEMP}/pages-site/token-balances.mjs"
          install -m 644 i18n-bundle.mjs "${RUNNER_TEMP}/pages-site/i18n-bundle.mjs"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-site
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          for attempt in {1..30}; do
            if response="$(curl --fail --silent --show-error --max-time 15 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" 2>/dev/null)"; then
              if jq -e --arg expected "${EXPECTED_ARTIFACT}" \
                '.artifacts | any(.[]; .name == $expected and .expired == false)' \
                <<< "${response}" >/dev/null; then
                echo "Pages artifact metadata is available: ${EXPECTED_ARTIFACT}"
                exit 0
              fi
            fi

            echo "Waiting for Pages artifact metadata (${attempt}/30)..."
            sleep 5
          done

          echo "::error::Pages artifact ${EXPECTED_ARTIFACT} was not visible through the Actions API after 150 seconds."
          exit 1
      - name: Wait for artifact synchronization
        run: sleep 30
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify published site files
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_DIR: ${{ runner.temp }}/pages-site
        shell: bash
        run: |
          actual_dir="$(mktemp -d)"
          for attempt in {1..10}; do
            matched=true
            for file in index.html token-balances.mjs i18n-bundle.mjs; do
              if ! curl --fail --silent --show-error --max-time 15 \
                -o "$actual_dir/$file" \
                "${PAGE_URL%/}/$file?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$attempt" ||
                ! cmp -s "$EXPECTED_DIR/$file" "$actual_dir/$file"; then
                echo "Waiting for published $file to match the deployment package (attempt $attempt)."
                matched=false
              fi
            done
            if [[ "$matched" == true ]]; then
              echo "All published files match the deployment package byte for byte."
              exit 0
            fi
            if [[ "$attempt" -lt 10 ]]; then sleep 6; fi
          done
          echo "::error::Published site files did not match the deployment package."
          exit 1
