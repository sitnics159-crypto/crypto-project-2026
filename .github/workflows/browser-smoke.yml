name: Browser smoke test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start local preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/preview-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview-server.log
          exit 1
      - name: Test page against live Sepolia and Kraken APIs
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ acceptDownloads: true });
            const apiResponses = [];
            page.on('response', response => {
              if (response.url().includes('eth-sepolia.blockscout.com/api/v2/') ||
                  response.url().includes('api.kraken.com/0/public/')) {
                apiResponses.push({ url: response.url(), status: response.status() });
            if (response.url().includes('/token-transfers?')) {
              response.json().then(body => console.log('ERC-20 API payload:', JSON.stringify({
                itemCount: Array.isArray(body.items) ? body.items.length : null,
                nextPage: body.next_page_params || null,
                firstItem: body.items?.[0] || null,
                message: body.message || null
              }))).catch(error => console.log('Could not read token API payload:', error.message));
            }
              }
            });
            page.on('pageerror', error => console.error('PAGE ERROR:', error.message));
            try {
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
              if (!(await page.title()).includes('Sepolia')) throw new Error('Unexpected page title');

              const edgeCases = await page.evaluate(() => {
                const amountZeroDecimals = tokenAmount({ total: { value: '12345', decimals: '0' } });
                const amountTiny = tokenAmount({ total: { value: '1', decimals: '18' } });
                const amountInvalidDecimals = tokenAmount({ total: { value: '12345', decimals: '256' } });
                const amountMissingDecimals = tokenAmount({ total: { value: '12345' } });
                const formulaCell = csvCell('=HYPERLINK("https://example.com")');
                tokenTransferAddress = '0x' + 'a'.repeat(40);
                tokenTransferItems = [
                  { transaction_hash: '0x1', from: { hash: tokenTransferAddress }, to: { hash: tokenTransferAddress }, total: { value: '1', decimals: '0' } },
                  { transaction_hash: '0x2', from: { hash: '0x' + 'b'.repeat(40) }, to: { hash: tokenTransferAddress }, total: { value: '1', decimals: '0' } },
                  { transaction_hash: '0x3', from: { hash: tokenTransferAddress }, to: { hash: '0x' + 'b'.repeat(40) }, total: { value: '1', decimals: '0' } }
                ];
                tokenTransferFilter = 'incoming';
                const incoming = filteredTokenTransfers().map(item => item.transaction_hash);
                tokenTransferFilter = 'outgoing';
                const outgoing = filteredTokenTransfers().map(item => item.transaction_hash);
                tokenTransferFilter = 'all';
                return { amountZeroDecimals, amountTiny, amountInvalidDecimals, amountMissingDecimals, formulaCell, incoming, outgoing };
              });
              if (edgeCases.amountZeroDecimals !== '12345') throw new Error('Zero-decimals token amount failed: ' + edgeCases.amountZeroDecimals);
              if (edgeCases.amountTiny !== '0.000000000000000001') throw new Error('Tiny ERC-20 amount lost precision: ' + edgeCases.amountTiny);
              if (!edgeCases.amountInvalidDecimals.includes('decimals недоступен')) throw new Error('Invalid decimals were not rejected safely');
              if (!edgeCases.amountMissingDecimals.includes('decimals недоступен')) throw new Error('Missing decimals were not handled safely');
              if (edgeCases.incoming.join(',') !== '0x2' || edgeCases.outgoing.join(',') !== '0x3') {
                throw new Error('Self-transfer was incorrectly included in incoming/outgoing filters: ' + JSON.stringify(edgeCases));
              }
              if (!edgeCases.formulaCell.startsWith('"\'=HYPERLINK')) throw new Error('CSV formula injection guard failed');
              console.log('Edge cases verified:', JSON.stringify(edgeCases));
              await page.locator('#market-title').waitFor();
              await page.waitForFunction(() => {
                const status = document.querySelector('#market-status')?.textContent || '';
                return status.includes('Обновлено') || status.includes('Не удалось') ||
                       status.includes('Слишком много запросов') || status.includes('Источник отвечает');
              }, { timeout: 25000 });
              const market = await page.locator('#market-status').innerText();
              console.log('Market status:', market);

              const address = '0xd482cCc8EC97e9cA7a365F2403bf7f228aD149A0';
              await page.locator('#address-input').fill(address);
              await page.locator('#address-submit').click();
              await page.waitForFunction(() =>
                !document.querySelector('#address-result').hidden ||
                !document.querySelector('#address-error').hidden,
                { timeout: 30000 }
              );
              const error = await page.locator('#address-error').innerText();
              if (!(await page.locator('#address-result').isVisible())) {
                throw new Error('Address lookup failed: ' + error);
              }
              const tokenRows = await page.locator('#address-token-transfers .token-transfer').count();
              console.log('Address loaded; ERC-20 rows:', tokenRows);
              const unfiltered = await page.evaluate(async address => {
                const response = await fetch('https://eth-sepolia.blockscout.com/api/v2/addresses/' +
                  encodeURIComponent(address) + '/token-transfers');
                const body = await response.json();
                return {
                  status: response.status,
                  itemCount: Array.isArray(body.items) ? body.items.length : null,
                  tokenTypes: [...new Set((body.items || []).map(item => item.token_type))],
                  firstItem: body.items?.[0] || null
                };
              }, address);
              console.log('Unfiltered token-transfer diagnostic:', JSON.stringify(unfiltered));
              if (tokenRows === 0 && (unfiltered.tokenTypes || []).includes('ERC-20')) {
                throw new Error('Unfiltered API contains ERC-20 records but filtered API returned none');
              }
              if (tokenRows === 0) {
                console.log('Known address has no ERC-20 records in current Blockscout response; ERC-20 filter excludes other token standards as intended.');
                return;
              }

              const firstRowText = await page.locator('#address-token-transfers .token-transfer').first().innerText();
              if (!firstRowText.includes('10 FAUCET')) throw new Error('Expected 10 FAUCET display; got: ' + firstRowText);

              const txHref = await page.locator('#address-token-transfers .token-transfer a').first().getAttribute('href');
              const txHash = txHref.split('/').pop();
              const txDiagnostics = await page.evaluate(async hash => {
                const base = 'https://eth-sepolia.blockscout.com/api/v2/transactions/' + encodeURIComponent(hash);
                const [detailResponse, transfersResponse, logsResponse] = await Promise.all([
                  fetch(base),
                  fetch(base + '/token-transfers?type=ERC-20'),
                  fetch(base + '/logs')
                ]);
                const [detail, transfers, logs] = await Promise.all([
                  detailResponse.json(), transfersResponse.json(), logsResponse.json()
                ]);
                return {
                  statuses: [detailResponse.status, transfersResponse.status, logsResponse.status],
                  detailHash: detail.hash,
                  transferItems: transfers.items || [],
                  logCount: Array.isArray(logs.items) ? logs.items.length : null,
                  transferEventCount: (logs.items || []).filter(log =>
                    Array.isArray(log.topics) &&
                    String(log.topics[0]).toLowerCase() === '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
                  ).length
                };
              }, txHash);
              if (txDiagnostics.statuses.some(status => status !== 200)) {
                throw new Error('Transaction detail/token-transfer/log API failed: ' + txDiagnostics.statuses.join(','));
              }
              if (txDiagnostics.detailHash.toLowerCase() !== txHash.toLowerCase()) {
                throw new Error('Transaction detail endpoint returned a different hash');
              }
              if (!txDiagnostics.transferItems.some(item =>
                item.transaction_hash.toLowerCase() === txHash.toLowerCase() && item.token_type === 'ERC-20'
              )) throw new Error('Transaction endpoint did not return its ERC-20 transfer');
              if (!txDiagnostics.transferEventCount) {
                throw new Error('Transaction logs contain no ERC-20 Transfer event');
              }
              console.log('Single transaction verified:', JSON.stringify({
                hash: txHash,
                ERC20Transfers: txDiagnostics.transferItems.length,
                totalLogs: txDiagnostics.logCount,
                transferEvents: txDiagnostics.transferEventCount
              }));
              const resolvedDecimals = await page.evaluate(async () => resolveTokenDecimals({
                token: { address_hash: '0x50B1eF6e0fe05a32F3E63F02f3c0151BD9004C7c' },
                total: { value: '1000000000000000000' }
              }));
              console.log('Metadata fallback decimals:', resolvedDecimals);
              if (resolvedDecimals !== 18) throw new Error('Token metadata decimals fallback failed: ' + resolvedDecimals);

              const tokenRequest = apiResponses.find(item =>
                item.url.includes('/token-transfers?') && item.url.includes('type=ERC-20'));
              if (!tokenRequest) throw new Error('ERC-20 endpoint was not requested');
              if (tokenRequest.status !== 200) throw new Error('ERC-20 endpoint status: ' + tokenRequest.status);

              for (const filter of ['incoming', 'outgoing', 'all']) {
                await page.locator('[data-token-filter="' + filter + '"]').click();
                await page.waitForTimeout(150);
                console.log(filter, 'visible rows:', await page.locator('#address-token-transfers .token-transfer').count());
              }

              await page.locator('[data-token-filter="all"]').click();
              if (await page.locator('#token-load-more').isVisible()) {
                const nextPageResponse = page.waitForResponse(response =>
                  response.url().includes('/token-transfers?') &&
                  response.url().includes('type=ERC-20') && response.status() === 200
                );
                await page.locator('#token-load-more').click();
                await nextPageResponse;
                await page.waitForFunction(() =>
                  document.querySelectorAll('#address-token-transfers .token-transfer').length === 10,
                  { timeout: 10000 }
                );
                console.log('Pagination loaded; visible rows:', await page.locator('#address-token-transfers .token-transfer').count());
              }
              const downloadPromise = page.waitForEvent('download');
              await page.locator('#token-export').click();
              const download = await downloadPromise;
              const path = await download.path();
              const fs = require('fs');
              const csv = fs.readFileSync(path, 'utf8');
              for (const header of ['transaction_hash', 'log_index', 'amount_raw', 'decimals']) {
                if (!csv.includes(header)) throw new Error('CSV missing column: ' + header);
              }
              console.log('CSV downloaded:', download.suggestedFilename(), 'bytes:', Buffer.byteLength(csv));
              console.log('Relevant live API responses:', JSON.stringify(apiResponses, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          JS
