name: Localization tests
on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/i18n-*'
permissions:
  contents: read
jobs:
  localization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: node --test tests/i18n.test.mjs tests/i18n-build.test.mjs
