name: Localization tests
on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/i18n-*'
permissions:
  contents: read
jobs:
  localization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/i18n.test.mjs
