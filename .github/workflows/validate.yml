name: Validate static site

on:
  schedule:
    - cron: '17 5 * * 1' # Weekly Monday 05:17 UTC
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.parts = []
                  self.current = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.external = any(k.lower() == "src" for k, _ in attrs)
                      self.current = []

              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external and "".join(self.current).strip():
                          self.parts.append("".join(self.current))
                      self.in_script = False
                      self.external = False

          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          if not parser.parts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/site-inline.js").write_text("\n;\n".join(parser.parts), encoding="utf-8")
          print(f"Extracted {len(parser.parts)} inline script block(s)")
          PY
          node --check /tmp/site-inline.js
      - name: Check ERC-20 safeguards are present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          checks = {
              "ERC-20 filter on initial request": "token-transfers?type=ERC-20",
              "ERC-20 filter on pagination": "params.set('type','ERC-20')",
              "token metadata fallback": "/api/sepolia/tokens/",
              "self-transfer label": "Внутренний перевод",
              "event log index in CSV": "'log_index'",
              "CSV waits for decimals": "await Promise.all(rows.map",
          }
          missing = [name for name, needle in checks.items() if needle not in html]
          for name in checks:
              print(("PASS " if name not in missing else "FAIL ") + name)
          if missing:
              raise SystemExit("Missing checks: " + ", ".join(missing))
          PY
